# AICPM RV1106G network configuration.
#
# WPA lifecycle is owned by aicpm-wifi-manager.  Keep dhcpcd's packaged
# wpa_supplicant hook disabled so it cannot start a competing instance with
# the intentionally secret-free /etc/wpa_supplicant.conf.
nohook wpa_supplicant

# Use the same DHCP defaults as the SDK base image.
duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
option host_name
option rapid_commit
require dhcp_server_identifier
slaac private

interface usb0
static ip_address=192.168.137.100/24
static routers=192.168.137.1
static domain_name_servers=8.8.8.8 8.8.4.4
